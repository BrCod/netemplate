name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check PR title
      run: |
        PR_TITLE="${{ github.event.pull_request.title }}"
        if ! echo "$PR_TITLE" | grep -E '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+$'; then
          echo "❌ PR title must follow Conventional Commits format"
          echo "Examples:"
          echo "  - feat: add new feature"
          echo "  - fix(api): resolve bug in controller"
          echo "  - docs: update README"
          exit 1
        fi
        echo "✅ PR title follows Conventional Commits format"

    - name: Check PR description
      run: |
        if [ -z "${{ github.event.pull_request.body }}" ]; then
          echo "❌ PR description is required"
          exit 1
        fi
        echo "✅ PR has a description"

    - name: Check for linked issues
      run: |
        BODY="${{ github.event.pull_request.body }}"
        if ! echo "$BODY" | grep -qiE '(closes|fixes|resolves) #[0-9]+'; then
          echo "⚠️  Warning: No linked issue found. Consider linking an issue using 'Closes #123'"
        else
          echo "✅ PR links to an issue"
        fi

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netemplate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Netemplate.sln

    - name: Build solution
      run: dotnet build Netemplate.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test Netemplate.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=netemplate_test;Username=postgres;Password=postgres"
        ConnectionStrings__Redis: "localhost:6379"
        ConnectionStrings__RabbitMQ: "amqp://guest:guest@localhost:5672"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr-test-results
        path: '**/TestResults/*.trx'
        retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Netemplate.sln

    - name: Check code formatting
      run: dotnet format Netemplate.sln --verify-no-changes --verbosity diagnostic

    - name: Run code analyzers
      run: dotnet build Netemplate.sln --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true

  changes-check:
    name: Check File Changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        files: |
          src/**
          tests/**

    - name: Check for tests
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        SRC_CHANGED=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -c "^src/" || true)
        TEST_CHANGED=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -c "^tests/" || true)
        
        if [ "$SRC_CHANGED" -gt 0 ] && [ "$TEST_CHANGED" -eq 0 ]; then
          echo "⚠️  Warning: Source code changed but no test files were modified"
          echo "Consider adding or updating tests for your changes"
        else
          echo "✅ Test coverage check passed"
        fi

  approve-ready:
    name: Ready for Review
    runs-on: ubuntu-latest
    needs: [validate, build-and-test, code-quality]
    if: success()
    
    steps:
    - name: Add success comment
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## ✅ PR Validation Passed
          
          All checks have passed successfully!
          
          - ✅ PR format validation
          - ✅ Build successful
          - ✅ All tests passed
          - ✅ Code quality checks passed
          
          This PR is ready for review.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
