name: CI

on:
  push:
    branches: [ main, develop, feat-* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  ARTIFACT_NAME: 'netemplate-api'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Netemplate.sln

    - name: Build solution
      run: dotnet build Netemplate.sln --configuration Release --no-restore

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          src/**/bin/Release/**
          !src/**/bin/Release/**/ref/**
        retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netemplate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Netemplate.sln

    - name: Run unit tests
      run: dotnet test Netemplate.sln --configuration Release --no-restore --filter "Category!=Integration" --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Run integration tests
      run: dotnet test Netemplate.sln --configuration Release --no-build --filter "Category=Integration" --verbosity normal --logger "trx;LogFileName=integration-test-results.trx"
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=netemplate_test;Username=postgres;Password=postgres"
        ConnectionStrings__Redis: "localhost:6379"
        ConnectionStrings__RabbitMQ: "amqp://guest:guest@localhost:5672"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'
        retention-days: 30

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netemplate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Netemplate.sln

    - name: Run tests with coverage
      run: dotnet test Netemplate.sln --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory ./coverage --settings build/coverlet.runsettings
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=netemplate_test;Username=postgres;Password=postgres"
        ConnectionStrings__Redis: "localhost:6379"
        ConnectionStrings__RabbitMQ: "amqp://guest:guest@localhost:5672"

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"coverage/report" -reporttypes:"HtmlInline_AzurePipelines;Cobertura;JsonSummary"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/report/
        retention-days: 30

    - name: Extract coverage summary
      id: coverage
      run: |
        COVERAGE=$(jq -r '.summary.linecoverage' coverage/report/Summary.json)
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Line Coverage: $COVERAGE%"

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const coverage = '${{ steps.coverage.outputs.coverage }}';
          const comment = `## Code Coverage Report\n\n📊 Line Coverage: **${coverage}%**\n\n[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Netemplate.sln

    - name: Check code formatting
      run: dotnet format Netemplate.sln --verify-no-changes --verbosity diagnostic

    - name: Install dotnet-format
      run: dotnet tool install -g dotnet-format || true

    - name: Run code analyzers
      run: dotnet build Netemplate.sln --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Netemplate.sln

    - name: Check for vulnerable packages
      run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt

    - name: Check for deprecated packages
      run: dotnet list package --deprecated 2>&1 | tee deprecated.txt

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: |
          vulnerable.txt
          deprecated.txt
        retention-days: 30

  publish:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Netemplate.sln

    - name: Publish API
      run: dotnet publish src/Api/Netemplate.Api.csproj --configuration Release --output ./publish --no-restore

    - name: Create version file
      run: |
        echo "Build: ${{ github.run_number }}" > ./publish/version.txt
        echo "Commit: ${{ github.sha }}" >> ./publish/version.txt
        echo "Branch: ${{ github.ref_name }}" >> ./publish/version.txt
        echo "Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ./publish/version.txt

    - name: Upload publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-${{ github.run_number }}
        path: ./publish/
        retention-days: 90

    - name: Create release tag (main branch only)
      if: github.ref == 'refs/heads/main'
      run: |
        VERSION="v1.0.${{ github.run_number }}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Creating release version: $VERSION"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [build, test, lint, code-coverage, security-scan]
    if: always()
    
    steps:
    - name: Check workflow status
      run: |
        if [ "${{ needs.build.result }}" != "success" ] || \
           [ "${{ needs.test.result }}" != "success" ] || \
           [ "${{ needs.lint.result }}" != "success" ] || \
           [ "${{ needs.code-coverage.result }}" != "success" ] || \
           [ "${{ needs.security-scan.result }}" != "success" ]; then
          echo "❌ CI Pipeline Failed"
          exit 1
        else
          echo "✅ CI Pipeline Passed"
        fi
